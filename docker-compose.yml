name: cinema

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cinema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-cinema_core}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    environment:
      PORT: 3001
      SERVICE_NAME: api
      DATABASE_URL: postgres://${POSTGRES_USER:-cinema}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cinema_core}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment:
    build: ./services/payment
    environment:
      PORT: 3002
      SERVICE_NAME: payment
      DATABASE_URL: postgres://${POSTGRES_USER:-cinema}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/cinema_payment
    ports:
      - "${PAYMENT_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification:
    build: ./services/notification
    environment:
      PORT: 3003
      SERVICE_NAME: notification
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "${NOTIFICATION_PORT:-3003}:3003"
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
        VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-mock}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
