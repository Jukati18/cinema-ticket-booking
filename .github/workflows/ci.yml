name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [services/api, services/payment, services/notification, apps/web]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: |
          curl -fsS http://localhost:3001/health
          curl -fsS http://localhost:3002/health
          curl -fsS http://localhost:3003/health
          curl -fsS -o /dev/null http://localhost:5173/
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
